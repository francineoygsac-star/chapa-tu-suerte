<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración · Chapa Tu Suerte</title>
<style>
body{font-family:Arial;margin:0;background:#07070b;color:#fff}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#12121a;border:1px solid #2a2a33;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:16px;border-radius:14px;background:#1a1a23}.stat b{display:block;font-size:28px;color:#ffd400}button{border:0;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer}.approve{background:#16a66a;color:#fff}.reject{background:#d9273f;color:#fff}.whatsapp{background:#25d366;color:#07140c;display:block;margin-top:10px;width:100%}.login{max-width:420px;margin:10vh auto}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;font-weight:800}.field input,.field select{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0c0c11;color:#fff;box-sizing:border-box}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.order{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#292934;font-size:12px}.tickets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.ticket{background:#0a7c4b;padding:6px 9px;border-radius:999px;font-weight:900}.proof{width:180px;height:180px;object-fit:contain;border-radius:10px;display:block;margin-top:8px;background:#20202a}.loading{padding:28px;text-align:center;color:#c9c9d2}.proof-wrap{display:inline-block;min-height:180px}.user-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}.secret-box{background:#071b12;border:1px solid #15915c;padding:16px;border-radius:12px;word-break:break-all}.user-row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #292932;padding:14px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.order{grid-template-columns:1fr}.proof{width:150px;height:150px}.user-grid{grid-template-columns:1fr}.user-row{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div id="login" class="card login"><h1>Panel de administración</h1><p>Chapa Tu Suerte</p>
<div class="field"><label>Usuario</label><input id="u" value="admin"></div>
<div class="field"><label>Contraseña</label><input id="p" type="password"></div>
<div class="field"><label>Código de seguridad (si está activado)</label><input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 dígitos"></div>
<button onclick="login()" style="background:#ffd400">INGRESAR</button><div id="lm" style="margin-top:12px"></div></div>
<div id="app" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><h1 style="margin-bottom:4px">Solicitudes y tickets</h1><span id="currentIdentity" class="badge"></span></div><div><button id="revokeBtn" onclick="revokeAllSessions()" style="background:#8f1425;color:#fff">CERRAR TODAS LAS SESIONES</button> <button onclick="logout()">SALIR</button></div></div>
<div class="grid" id="stats"></div>
<div class="toolbar" style="margin:18px 0"><button onclick="load('all')">TODAS</button><button onclick="load('pending')">PENDIENTES</button><button onclick="load('approved')">APROBADAS</button><button onclick="load('rejected')">RECHAZADAS</button><button onclick="load('expired')">VENCIDAS</button><button id="exportBtn" onclick="downloadExcel()" style="background:#168b4b;color:#fff">📊 DESCARGAR EXCEL</button><button id="deleteBtn" onclick="deleteSelected()" style="background:#8f1425;color:#fff">🗑 ELIMINAR SELECCIONADAS</button><button id="usersBtn" onclick="toggleUsers()" style="background:#ffd400;color:#111">👥 USUARIOS ADMIN</button></div>
<section id="usersPanel" class="card" style="display:none"><h2>Usuarios administradores</h2><p>La clave de Authenticator se muestra una sola vez. Entrégala de forma privada al usuario.</p><div class="user-grid"><div class="field"><label>Nuevo usuario</label><input id="newUsername" autocomplete="off" placeholder="Ej. pagos.maria"></div><div class="field"><label>Contraseña segura</label><input id="newPassword" type="password" autocomplete="new-password" placeholder="Mínimo 14 caracteres"></div><div class="field"><label>Rol</label><select id="newRole"><option value="validator">Validador de pagos</option><option value="viewer">Solo consulta</option></select></div><button onclick="createUser()" style="background:#16a66a;color:#fff;margin-bottom:12px">CREAR USUARIO</button></div><div id="userSecret"></div><div id="usersList" style="margin-top:18px"></div></section>
<div id="orders"></div></div></div>
<script>
let csrfToken='';
let currentRole='';let currentUser='';
function adminHeaders(){return {'Content-Type':'application/json','X-CSRF-Token':csrfToken}}
async function login(){let r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value,totp:otp.value})});let d=await r.json();if(!r.ok){lm.textContent=d.error;return}csrfToken=d.csrf_token||'';currentRole=d.role||'viewer';currentUser=d.user||u.value;p.value='';otp.value='';document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';configureRole();load('pending');stats();}
async function logout(){await fetch('/admin/logout',{method:'POST',headers:adminHeaders()});csrfToken='';location.reload()}
async function revokeAllSessions(){if(!confirm('Se cerrará el panel en todos los dispositivos. ¿Deseas continuar?'))return;const r=await fetch('/api/admin/sessions/revoke-all',{method:'POST',headers:adminHeaders()});const d=await r.json();if(!r.ok){alert(d.error||'No se pudieron cerrar las sesiones.');return}csrfToken='';alert('Todas las sesiones fueron cerradas.');location.reload()}
function downloadExcel(){window.location.href='/api/admin/export.xlsx'}
function configureRole(){const labels={owner:'ADMINISTRADOR PRINCIPAL',validator:'VALIDADOR DE PAGOS',viewer:'SOLO CONSULTA'};currentIdentity.textContent=currentUser+' · '+(labels[currentRole]||currentRole);const owner=currentRole==='owner';const canExport=owner||currentRole==='validator';revokeBtn.style.display=owner?'inline-block':'none';exportBtn.style.display=canExport?'inline-block':'none';deleteBtn.style.display=owner?'inline-block':'none';usersBtn.style.display=owner?'inline-block':'none'}
function toggleUsers(){usersPanel.style.display=usersPanel.style.display==='none'?'block':'none';if(usersPanel.style.display==='block')loadUsers()}
async function stats(){let r=await fetch('/api/admin/stats');if(!r.ok)return;let d=await r.json();document.getElementById('stats').innerHTML=[['Pendientes',d.pending],['Aprobadas',d.approved],['Rechazadas',d.rejected],['Tickets confirmados',d.confirmed_tickets],['Ventas aprobadas','S/'+d.sales_approved]].map(x=>'<div class="stat">'+x[0]+'<b>'+x[1]+'</b></div>').join('')}
let proofObserver;
let currentOrders=[];
let currentStatus='pending';
const statusLabels={pending:'PENDIENTE',approved:'APROBADA',rejected:'RECHAZADA',expired:'VENCIDA'};
function sendWhatsApp(id){
  const o=currentOrders.find(item=>String(item.id)===String(id));
  if(!o){alert('No se encontró la solicitud');return}
  const phone=String(o.phone||'').replace(/\D/g,'');
  if(!/^9\d{8}$/.test(phone)){alert('La solicitud no tiene un número de WhatsApp válido');return}
  const state=statusLabels[o.status]||String(o.status||'').toUpperCase();
  const ticketNumbers=(o.tickets||[]).join(', ')||'Ninguno';
  const ticketLabel=o.status==='approved'?'Tickets asignados':
    o.status==='pending'?'Tickets reservados':'Tickets liberados';
  const closing={
    pending:'Hemos recibido tu solicitud y el pago se encuentra pendiente de validación.',
    approved:'Tu pago fue validado correctamente. Conserva este mensaje como confirmación de tu participación.',
    rejected:'El pago no pudo ser validado. Comunícate con nosotros si necesitas una nueva revisión.',
    expired:'El tiempo de reserva terminó y los números fueron liberados. Comunícate con nosotros si ya realizaste el pago.'
  }[o.status]||'Consulta con nosotros si necesitas más información.';
  const lines=[
    'CHAPA TU SUERTE - SOLICITUD DE COMPRA ('+state+')','',
    'Nombre: '+o.name,
    'Número de WhatsApp: '+phone,
    'Cantidad de tickets: '+o.quantity,
    'Total: S/'+o.total,
    'Código de solicitud: '+o.code,
    ticketLabel+': '+ticketNumbers,'',closing
  ];
  if((o.status==='rejected'||o.status==='expired')&&o.review_note)lines.push('Observación: '+o.review_note);
  window.open('https://wa.me/51'+phone+'?text='+encodeURIComponent(lines.join('\n')),'_blank','noopener');
}
async function deleteSelected(){
  const ids=[...document.querySelectorAll('.order-select:checked')].map(input=>input.value);
  if(!ids.length){alert('Marca primero las compras de prueba que deseas eliminar.');return}
  const answer=prompt('Esta acción eliminará permanentemente '+ids.length+' compra(s), sus tickets y comprobantes.\n\nEscribe ELIMINAR para confirmar:');
  if(answer!=='ELIMINAR')return;
  const r=await fetch('/api/admin/orders/delete-selected',{
    method:'POST',headers:adminHeaders(),
    body:JSON.stringify({ids,confirmation:'ELIMINAR'})
  });
  const d=await r.json();
  if(!r.ok){alert(d.error||'No se pudieron eliminar las compras.');return}
  let message='Se eliminaron '+d.count+' compra(s) de prueba.';
  if(d.proof_warnings&&d.proof_warnings.length)message+='\nAlgunos comprobantes requieren revisión en el bucket.';
  alert(message);
  await Promise.all([load(currentStatus),stats()]);
}
function activateProofs(){
  if(proofObserver)proofObserver.disconnect();
  proofObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{
    if(!entry.isIntersecting)return;
    const img=entry.target;
    img.src=img.dataset.src;
    img.removeAttribute('data-src');
    proofObserver.unobserve(img);
  }),{rootMargin:'300px 0px'});
  document.querySelectorAll('img[data-src]').forEach(img=>proofObserver.observe(img));
}
function allocationFieldsHtml(id,total,omar,franci){return '<div style="margin-bottom:9px"><label style="display:block;margin:6px 0">Monto recibido por Omar (S/)</label><input id="amount-omar-'+id+'" type="number" min="0" step="1" value="'+omar+'" style="width:100%;padding:9px;box-sizing:border-box;border-radius:7px"><label style="display:block;margin:6px 0">Monto recibido por Franci (S/)</label><input id="amount-franci-'+id+'" type="number" min="0" step="1" value="'+franci+'" style="width:100%;padding:9px;box-sizing:border-box;border-radius:7px"><small>La suma debe ser S/'+total+'</small></div>'}
function whatsappButtonHtml(id){return '<button class="whatsapp" data-id="'+id+'" onclick="sendWhatsApp(this.dataset.id)">ENVIAR ESTADO POR WHATSAPP</button>'}
function confirmedAllocationHtml(id,total,omar,franci){return '<div style="background:#071b12;border:1px solid #15915c;border-radius:10px;padding:13px;margin-bottom:9px"><b style="color:#79e5ae">✓ DISTRIBUCIÓN CONFIRMADA</b><p style="margin:9px 0 4px">Omar: <b>S/'+omar+'</b></p><p style="margin:4px 0">Franci: <b>S/'+franci+'</b></p><p style="margin:4px 0">Total: <b>S/'+total+'</b></p></div><button onclick="editAllocation('+id+','+total+','+omar+','+franci+')">MODIFICAR DISTRIBUCIÓN</button>'}
function editAllocation(id,total,omar,franci){if(!confirm('La distribución ya fue confirmada. ¿Deseas habilitarla para corregir los montos?'))return;const box=document.getElementById('actions-'+id);box.innerHTML=allocationFieldsHtml(id,total,omar,franci)+'<button onclick="saveAllocation('+id+','+total+')" style="background:#ffd400">GUARDAR CAMBIOS</button>'+whatsappButtonHtml(id)}
async function load(status){
  currentStatus=status;
  const container=document.getElementById('orders');
  container.innerHTML='<div class="loading">Cargando solicitudes y comprobantes…</div>';
  let r=await fetch('/api/admin/orders?status='+encodeURIComponent(status));
  if(r.status===401){document.getElementById('login').style.display='block';document.getElementById('app').style.display='none';return}
  let d=await r.json();
  currentOrders=d.orders;
  const canValidate=currentRole==='owner'||currentRole==='validator';
  container.innerHTML=d.orders.map(o=>{
    const selector=currentRole==='owner'?'<input class="order-select" type="checkbox" value="'+o.id+'" aria-label="Seleccionar '+esc(o.code)+'"> ':'';
    let actions='<span class="badge">'+esc(o.review_note||'Procesado')+'</span>';
    const oldOmar=o.payment_recipient==='omar'?o.total:0,oldFranci=o.payment_recipient==='franci'?o.total:0;
    const amountOmar=o.payment_amount_omar??oldOmar,amountFranci=o.payment_amount_franci??oldFranci;
    const allocation=allocationFieldsHtml(o.id,o.total,amountOmar,amountFranci);
    const allocationConfirmed=o.payment_amount_omar!==null&&o.payment_amount_omar!==undefined&&o.payment_amount_franci!==null&&o.payment_amount_franci!==undefined;
    if(canValidate&&o.status==='pending')actions=allocation+'<button class="approve" onclick="act('+o.id+',\'approve\')">APROBAR PAGO</button> <button class="reject" onclick="act('+o.id+',\'reject\')">RECHAZAR</button>';
    else if(canValidate&&o.status==='expired')actions=allocation+'<button class="approve" onclick="act('+o.id+',\'approve\')">VALIDAR PAGO VENCIDO</button>';
    else if(canValidate&&o.status==='approved'&&allocationConfirmed)actions=confirmedAllocationHtml(o.id,o.total,amountOmar,amountFranci);
    else if(canValidate&&o.status==='approved')actions=allocation+'<button onclick="saveAllocation('+o.id+','+o.total+')" style="background:#ffd400">GUARDAR DISTRIBUCIÓN DEL PAGO</button>';
    if(canValidate)actions+=whatsappButtonHtml(o.id);
    const proofUrls=(o.proof_urls&&o.proof_urls.length?o.proof_urls:(o.proof_url?[o.proof_url]:[]));
    const proofs=proofUrls.map((url,index)=>'<a class="proof-wrap" href="'+encodeURI(url)+'" target="_blank" title="Abrir comprobante '+(index+1)+'"><img class="proof" data-src="'+encodeURI(url)+'" alt="Comprobante '+(index+1)+' de '+esc(o.code)+'" loading="lazy" decoding="async"></a>').join(' ');
    return '<div class="card order"><div><h2>'+selector+esc(o.code)+' <span class="badge">'+esc(statusLabels[o.status]||o.status.toUpperCase())+'</span></h2><p><b>'+esc(o.name)+'</b> · '+esc(o.phone)+' · '+o.quantity+' ticket(s) · S/'+o.total+'</p><p>Creado: '+esc(o.created_at)+' <span class="badge">HORA PERÚ</span></p><div class="tickets">'+o.tickets.map(t=>'<span class="ticket">#'+t+'</span>').join('')+'</div>'+(proofs?'<p><b>Comprobantes: '+proofUrls.length+'</b></p>'+proofs:'')+'</div><div id="actions-'+o.id+'">'+actions+'</div></div>';
  }).join('');
  if(!d.orders.length)container.innerHTML='<div class="loading">No hay solicitudes en esta categoría.</div>';
  activateProofs();
}
function paymentAmounts(id){return {amount_omar:Number(document.getElementById('amount-omar-'+id)?.value||0),amount_franci:Number(document.getElementById('amount-franci-'+id)?.value||0)}}
async function act(id,a){const amounts=paymentAmounts(id);if(a==='approve'&&(!Number.isInteger(amounts.amount_omar)||!Number.isInteger(amounts.amount_franci))){alert('Ingresa montos enteros válidos.');return}let note=prompt(a==='approve'?'Nota de aprobación (opcional):':'Motivo del rechazo (opcional):')||'';let r=await fetch('/api/admin/orders/'+id+'/'+a,{method:'POST',headers:adminHeaders(),body:JSON.stringify({note,...amounts})});let d=await r.json();if(!r.ok){alert(d.error);return}if(d.message)alert(d.message+(d.replacements&&d.replacements.length?'\nTickets confirmados: '+d.tickets.join(', '):''));load('pending');stats()}
async function saveAllocation(id,total){const amounts=paymentAmounts(id);if(!Number.isInteger(amounts.amount_omar)||!Number.isInteger(amounts.amount_franci)||amounts.amount_omar<0||amounts.amount_franci<0||amounts.amount_omar+amounts.amount_franci!==total){alert('Los montos de Omar y Franci deben sumar S/'+total+'.');return}const r=await fetch('/api/admin/orders/'+id+'/recipient',{method:'PATCH',headers:adminHeaders(),body:JSON.stringify(amounts)});const d=await r.json();if(!r.ok){alert(d.error||'No se pudo guardar la distribución.');return}alert('Distribución del pago guardada correctamente.');load(currentStatus)}
async function loadUsers(){const r=await fetch('/api/admin/users');const d=await r.json();if(!r.ok){alert(d.error||'No se pudieron cargar los usuarios.');return}usersList.innerHTML=d.users.map(x=>'<div class="user-row"><div><b>'+esc(x.username)+'</b> <span class="badge">'+esc(x.role_label)+'</span><div style="margin-top:6px;color:#aaa">'+(x.active?'ACTIVO':'DESACTIVADO')+(x.last_login_at?' · Último acceso: '+esc(x.last_login_at):'')+'</div></div><div>'+(x.source==='firestore'?'<button onclick="toggleUser(\''+esc(x.username)+'\','+(!x.active)+')">'+(x.active?'DESACTIVAR':'ACTIVAR')+'</button> <button onclick="startResetUser(\''+esc(x.username)+'\')">RESTABLECER SEGURIDAD</button>':'<span class="badge">CONFIGURADO EN RENDER</span>')+'</div></div>').join('')}
function showSecret(d){userSecret.innerHTML='<div class="secret-box"><b>CONFIGURACIÓN PARA '+esc(d.username)+'</b><p>En Google Authenticator: + → Introducir clave de configuración.</p><p>Cuenta: <b>'+esc(d.username)+'</b><br>Clave secreta: <b>'+esc(d.totp_secret)+'</b><br>Tipo: Basada en tiempo</p><p>Esta clave se muestra una sola vez. No la envíes por un grupo ni la publiques.</p><button onclick="userSecret.innerHTML=\'\'">OCULTAR CLAVE</button></div>'}
async function createUser(){const body={username:newUsername.value.trim(),password:newPassword.value,role:newRole.value};const r=await fetch('/api/admin/users',{method:'POST',headers:adminHeaders(),body:JSON.stringify(body)});const d=await r.json();if(!r.ok){alert(d.error||'No se pudo crear el usuario.');return}newUsername.value='';newPassword.value='';showSecret(d);loadUsers()}
async function toggleUser(username,active){if(!confirm((active?'¿Activar a ':'¿Desactivar a ')+username+'? Sus sesiones actuales se cerrarán.'))return;const r=await fetch('/api/admin/users/'+encodeURIComponent(username),{method:'PATCH',headers:adminHeaders(),body:JSON.stringify({active})});const d=await r.json();if(!r.ok){alert(d.error||'No se pudo actualizar el usuario.');return}loadUsers()}
let resetTarget='';
function startResetUser(username){resetTarget=username;userSecret.innerHTML='<div class="secret-box"><b>RESTABLECER A '+esc(username)+'</b><div class="field"><label>Nueva contraseña segura</label><input id="resetPassword" type="password" autocomplete="new-password" placeholder="Mínimo 14 caracteres"></div><button onclick="confirmResetUser()">CONFIRMAR RESTABLECIMIENTO</button> <button onclick="userSecret.innerHTML=\'\'">CANCELAR</button></div>';document.getElementById('resetPassword').focus()}
async function confirmResetUser(){const input=document.getElementById('resetPassword');const password=input?input.value:'';if(!password)return;const r=await fetch('/api/admin/users/'+encodeURIComponent(resetTarget)+'/reset-security',{method:'POST',headers:adminHeaders(),body:JSON.stringify({password})});const d=await r.json();if(!r.ok){alert(d.error||'No se pudo restablecer la seguridad.');return}showSecret(d);loadUsers()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
</script></body></html>
